<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LeadFinder India</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      background: #172033;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .tag {
      font-size: 13px;
      opacity: 0.8;
    }

    /* ================= HERO ================= */

    .hero {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 14px;
    }

    .hero p {
      font-size: 18px;
      color: #667085;
      margin-bottom: 30px;
    }

    /* ================= SEARCH ================= */

    .search-box {
      background: white;
      max-width: 1050px;
      margin: auto;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);

      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    select,
    input,
    textarea {
      font-family: inherit;
    }

    .search-box select,
    .search-box input {

      padding: 14px;

      border: 1px solid #d8dce5;

      border-radius: 10px;

      font-size: 15px;

      background: white;
    }

    .search-box select {
      min-width: 200px;
    }

    .search-box input {
      flex: 1;
      min-width: 220px;
    }

    button,
    .map-btn,
    .direction-btn {

      padding: 12px 17px;

      border: none;

      border-radius: 9px;

      font-size: 14px;

      font-weight: bold;

      cursor: pointer;

      text-decoration: none;

      display: inline-block;

      transition: 0.2s;
    }

    button {
      background: #4f46e5;
      color: white;
    }

    button:hover {
      background: #3730a3;
    }

    .map-btn {
      background: #e0f2fe;
      color: #0369a1;
    }

    .map-btn:hover {
      background: #bae6fd;
    }

    .direction-btn {
      background: #dcfce7;
      color: #166534;
    }

    .direction-btn:hover {
      background: #bbf7d0;
    }

    /* ================= MAIN SECTIONS ================= */

    .results,
    .dashboard {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    #results {
      display: none;
    }

    .results h2,
    .dashboard h2 {
      margin-bottom: 20px;
    }

    /* ================= LEADS ================= */

    .lead {

      background: white;

      padding: 20px;

      margin-bottom: 15px;

      border-radius: 14px;

      box-shadow: 0 4px 15px rgba(0,0,0,0.06);

      border: 1px solid #edf0f5;
    }

    .lead h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }

    .lead p {
      color: #667085;
      margin: 6px 0;
    }

    .source {
      font-size: 12px;
      color: #98a2b3 !important;
      margin-top: 12px !important;
    }

    .lead-actions {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 16px;
    }

    .secondary-btn {
      background: #eef0ff;
      color: #3730a3;
    }

    .secondary-btn:hover {
      background: #dfe2ff;
    }

    .danger-btn {
      background: #fee2e2;
      color: #b91c1c;
    }

    .danger-btn:hover {
      background: #fecaca;
    }

    /* ================= LOADING ================= */

    .loading {

      background: white;

      padding: 25px;

      border-radius: 12px;

      text-align: center;

      color: #667085;

      margin-bottom: 15px;
    }

    /* ================= EMPTY ================= */

    .empty-message {

      background: white;

      padding: 30px;

      text-align: center;

      border-radius: 12px;

      color: #667085;
    }

    /* ================= DASHBOARD ================= */

    .dashboard-grid {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 12px;
    }

    .dashboard-card {

      background: white;

      padding: 18px 10px;

      border-radius: 12px;

      text-align: center;

      box-shadow: 0 3px 12px rgba(0,0,0,0.06);

      cursor: pointer;

      transition: 0.2s;
    }

    .dashboard-card:hover {

      transform: translateY(-2px);

      box-shadow:
        0 6px 16px rgba(0,0,0,0.10);
    }

    .dashboard-card h3 {

      font-size: 13px;

      margin-bottom: 8px;

      color: #667085;
    }

    .dashboard-card p {

      font-size: 25px;

      font-weight: bold;
    }

    /* ================= SAVED ================= */

    .saved-controls {

      display: flex;

      gap: 10px;

      margin-bottom: 20px;

      flex-wrap: wrap;
    }

    #savedSearch {

      flex: 1;

      min-width: 220px;

      padding: 12px;

      border:
        1px solid #d8dce5;

      border-radius: 9px;
    }

    #savedStatus {

      padding: 12px;

      border:
        1px solid #d8dce5;

      border-radius: 9px;

      background: white;
    }

    #savedList {

      display: grid;

      gap: 15px;
    }

    #savedList .lead {

      margin-bottom: 0;
    }

    #savedList select {

      margin-top: 12px;

      padding: 9px;

      border:
        1px solid #d8dce5;

      border-radius: 8px;

      background: white;
    }

    .note-box {

      width: 100%;

      min-height: 70px;

      margin-top: 12px;

      padding: 10px;

      border:
        1px solid #d8dce5;

      border-radius: 9px;

      resize: vertical;
    }

    .saved-note {

      margin-top: 12px;

      padding: 10px;

      background: #f8f9fc;

      border-radius: 8px;

      color: #4b5563;
    }

    .updated {

      font-size: 12px;

      color: #98a2b3 !important;

      margin-top: 10px !important;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 750px) {

      .navbar {

        flex-direction: column;

        text-align: center;
      }

      .hero h1 {

        font-size: 32px;
      }

      .dashboard-grid {

        grid-template-columns:
          repeat(2, 1fr);
      }

      .search-box {

        flex-direction: column;
      }

      .search-box select,
      .search-box input,
      .search-box button {

        width: 100%;
      }
    }

    @media (max-width: 450px) {

      .dashboard-grid {

        grid-template-columns: 1fr;
      }

      .results,
      .dashboard {

        padding: 15px;
      }

      .lead-actions button,
      .lead-actions a {

        width: 100%;

        text-align: center;
      }
    }

  </style>

</head>

  >

  <!-- ================= DASHBOARD ================= -->

  <script>


    /* =====================================================
       OVERPASS API
       ===================================================== */

    const OVERPASS_URL =
      "https://overpass-api.de/api/interpreter";


    /* =====================================================
       CATEGORY → OPENSTREETMAP TAGS
       ===================================================== */

    const categoryQueries = {


      restaurant: `
        nwr["amenity"="restaurant"](area.searchArea);
      `,


      cafe: `
        nwr["amenity"="cafe"](area.searchArea);
      `,


      fast_food: `
        nwr["amenity"="fast_food"](area.searchArea);
      `,


      bakery: `
        nwr["shop"="bakery"](area.searchArea);
      `,


      salon: `
        nwr["shop"="hairdresser"](area.searchArea);
      `,


      beauty: `
        nwr["shop"="beauty"](area.searchArea);
      `,


      hospital: `
        nwr["amenity"="hospital"](area.searchArea);
      `,


      clinic: `
        nwr["amenity"="clinic"](area.searchArea);
      `,


      dentist: `
        nwr["amenity"="dentist"](area.searchArea);
      `,


      veterinary: `
        nwr["amenity"="veterinary"](area.searchArea);
      `,


      pharmacy: `
        nwr["amenity"="pharmacy"](area.searchArea);
      `,


      school: `
        nwr["amenity"="school"](area.searchArea);
      `,


      college: `
        nwr["amenity"="college"](area.searchArea);
      `,


      kindergarten: `
        nwr["amenity"="kindergarten"](area.searchArea);
      `,


      gym: `
        nwr["leisure"="fitness_centre"](area.searchArea);
      `,


      hotel: `
        nwr["tourism"="hotel"](area.searchArea);
      `,


      bank: `
        nwr["amenity"="bank"](area.searchArea);
      `,


      atm: `
        nwr["amenity"="atm"](area.searchArea);
      `,


      fuel: `
        nwr["amenity"="fuel"](area.searchArea);
      `,


      car_repair: `
        nwr["shop"="car_repair"](area.searchArea);
      `,


      car_dealer: `
        nwr["shop"="car"](area.searchArea);
      `,


      motorcycle: `
        nwr["shop"="motorcycle"](area.searchArea);
      `,


      supermarket: `
        nwr["shop"="supermarket"](area.searchArea);
      `,


      clothing: `
        nwr["shop"="clothes"](area.searchArea);
      `,


      electronics: `
        nwr["shop"="electronics"](area.searchArea);
      `,


      hardware: `
        nwr["shop"="hardware"](area.searchArea);
      `,


      furniture: `
        nwr["shop"="furniture"](area.searchArea);
      `,


      jewellery: `
        nwr["shop"="jewelry"](area.searchArea);
      `,


      real_estate: `
        nwr["office"="estate_agent"](area.searchArea);
      `,


      lawyer: `
        nwr["office"="lawyer"](area.searchArea);
      `,


      accountant: `
        nwr["office"="accountant"](area.searchArea);
      `,


      travel: `
        nwr["shop"="travel_agency"](area.searchArea);
      `

    };


    /* =====================================================
       CATEGORY NAMES
       ===================================================== */

    const categoryNames = {

      restaurant: "Restaurants",

      cafe: "Cafes",

      fast_food: "Fast Food",

      bakery: "Bakeries",

      salon: "Salons",

      beauty: "Beauty & Spa",

      hospital: "Hospitals",

      clinic: "Clinics",

      dentist: "Dentists",

      veterinary: "Vet Clinics",

      pharmacy: "Medicals / Pharmacies",

      school: "Schools",

      college: "Colleges",

      kindergarten: "Kindergartens",

      gym: "Gyms",

      hotel: "Hotels",

      bank: "Banks",

      atm: "ATMs",

      fuel: "Petrol Pumps",

      car_repair: "Garages / Car Repair",

      car_dealer: "Car Dealers",

      motorcycle: "Bike Dealers",

      supermarket: "Supermarkets",

      clothing: "Clothing Stores",

      electronics: "Electronics",

      hardware: "Hardware Stores",

      furniture: "Furniture Stores",

      jewellery: "Jewellery",

      real_estate: "Real Estate",

      lawyer: "Lawyers",

      accountant: "Accountants",

      travel: "Travel Agencies"

    };


    /* =====================================================
       FIND REAL LEADS
       ===================================================== */

    async function findLeads() {


      const city =
        document.getElementById("city").value;


      const category =
        document.getElementById("category").value;


      const keyword =
        document.getElementById("keyword").value
          .trim()
          .toLowerCase();


      const results =
        document.getElementById("results");


      const title =
        document.getElementById("resultTitle");


      const list =
        document.getElementById("leadList");


      title.innerText =
        `${city} → ${categoryNames[category]}`;


      results.style.display = "block";


      list.innerHTML = `

        <div class="loading">

          🔎 Searching OpenStreetMap for real businesses...

          <br><br>

          Please wait...

        </div>

      `;


      results.scrollIntoView({
        behavior: "smooth"
      });


      const query = `

        [out:json][timeout:60];

        area["name"="${city}"]["boundary"="administrative"]->.searchArea;

        (
          ${categoryQueries[category]}
        );

        out center tags;

      `;


      try {


        const response =
          await fetch(
            OVERPASS_URL,
            {

              method: "POST",

              body:
                "data=" +
                encodeURIComponent(query)

            }
          );


        if (!response.ok) {

          throw new Error(
            "Overpass server error"
          );

        }


        const data =
          await response.json();


        let businesses =
          data.elements || [];


        /* =================================================
           REMOVE ITEMS WITHOUT NAMES
           ================================================= */

        businesses =
          businesses.filter(
            business =>
              business.tags &&
              business.tags.name
          );


        /* =================================================
           SEARCH KEYWORD
           ================================================= */

        if (keyword) {

          businesses =
            businesses.filter(
              business => {

                const name =
                  (
                    business.tags.name ||
                    ""
                  ).toLowerCase();


                const area =
                  (
                    business.tags["addr:suburb"] ||
                    business.tags["addr:city"] ||
                    ""
                  ).toLowerCase();


                return (

                  name.includes(keyword)

                  ||

                  area.includes(keyword)

                );

              }
            );

        }


        /* =================================================
           REMOVE DUPLICATES
           ================================================= */

        const unique =
          [];

        const seen =
          new Set();


        businesses.forEach(
          business => {

            const name =
              business.tags.name
                .toLowerCase();


            if (!seen.has(name)) {

              seen.add(name);

              unique.push(
                business
              );

            }

          }
        );


        /* =================================================
           LIMIT RESULTS
           ================================================= */

        businesses =
          unique.slice(0, 100);


        if (businesses.length === 0) {

          list.innerHTML = `

            <div class="empty-message">

              😕 No businesses found.

              <br><br>

              Try another category,
              city or keyword.

            </div>

          `;

          return;

        }


        /* =================================================
           DISPLAY RESULTS
           ================================================= */

        list.innerHTML = "";


        businesses.forEach(
          business => {

            const tags =
              business.tags || {};


            const name =
              tags.name ||
              "Unnamed Business";


            /* ============================================
               PHONE
               ============================================ */

            const phone =
              tags.phone ||
              tags["contact:phone"] ||
              "Not available";


            /* ============================================
               WEBSITE
               ============================================ */

            const website =
              tags.website ||
              tags["contact:website"] ||
              "";


            /* ============================================
               ADDRESS
               ============================================ */

            const addressParts = [

              tags["addr:housenumber"],

              tags["addr:street"],

              tags["addr:suburb"],

              tags["addr:city"],

              tags["addr:postcode"]

            ].filter(Boolean);


            const address =
              addressParts.length > 0

                ? addressParts.join(", ")

                : "Address not available";


            /* ============================================
               COORDINATES
               ============================================ */

            let lat =
              business.lat;

            let lon =
              business.lon;


            if (
              !lat &&
              business.center
            ) {

              lat =
                business.center.lat;

              lon =
                business.center.lon;

            }


            /* ============================================
               OSM ID
               ============================================ */

            const osmType =
              business.type;


            const osmId =
              business.id;


            /* ============================================
               EXACT OSM MAP
               ============================================ */

            let mapUrl =
              "#";


            let directionUrl =
              "#";


            if (lat && lon) {

              mapUrl =
                `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=19/${lat}/${lon}`;


              /* Google Maps directions */

              directionUrl =
                `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}`;

            }


            /* ============================================
               WEBSITE HTML
               ============================================ */

            let websiteHTML =
              "";


            if (website) {

              let safeWebsite =
                website;


              if (
                !safeWebsite.startsWith(
                  "http://"
                ) &&
                !safeWebsite.startsWith(
                  "https://"
                )
              ) {

                safeWebsite =
                  "https://" +
                  safeWebsite;

              }


              websiteHTML = `

                <p>
                  🌐

                  <a
                    href="${safeWebsite}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Website
                  </a>
                </p>

              `;

            }


            /* ============================================
               OSM LINK
               ============================================ */

            const osmUrl =
              `https://www.openstreetmap.org/${osmType}/${osmId}`;


            /* ============================================
               CARD
               ============================================ */

            list.innerHTML += `

              <div class="lead">

                <h3>
                  ${escapeHTML(name)}
                </h3>


                <p>
                  📍
                  ${escapeHTML(address)}
                </p>


                <p>
                  📞
                  ${escapeHTML(phone)}
                </p>


                ${websiteHTML}


                <p class="source">

                  🗺️ Source:
                  OpenStreetMap

                </p>


                <div class="lead-actions">


                  <!-- DETAILS -->

                  <button
                    onclick='showDetails(
                      ${JSON.stringify({
                        name,
                        phone,
                        address,
                        website,
                        lat,
                        lon,
                        osmUrl
                      })}
                    )'
                  >

                    👀 View Details

                  </button>


                  <!-- SAVE -->

                  <button
                    class="secondary-btn"
                    onclick='saveLead(
                      ${JSON.stringify({
                        name,
                        phone,
                        address,
                        website,
                        lat,
                        lon,
                        osmUrl
                      })}
                    )'
                  >

                    ⭐ Save Lead

                  </button>


                  <!-- EXACT LOCATION -->

                  ${
                    lat && lon

                    ?

                    `

                    <a
                      class="map-btn"
                      href="${mapUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >

                      🗺️ View Location

                    </a>

                    `

                    :

                    ""

                  }


                  <!-- DIRECTIONS -->

                  ${
                    lat && lon

                    ?

                    `

                    <a
                      class="direction-btn"
                      href="${directionUrl}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >

                      🧭 Get Directions

                    </a>

                    `

                    :

                    ""

                  }


                </div>

              </div>

            `;

          }
        );


      }

      catch (error) {


        console.error(error);


        list.innerHTML = `

          <div class="empty-message">

            ❌ Could not fetch real business data.

            <br><br>

            The OpenStreetMap/Overpass server
            may be busy.

            <br><br>

            Please try again in a few seconds.

          </div>

        `;

      }

    }


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {

        return "";

      }


      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =====================================================
       BUSINESS DETAILS
       ===================================================== */

    function showDetails(lead) {


      let message =

        "BUSINESS DETAILS\n\n" +

        "🏪 " +
        lead.name +

        "\n\n" +

        "📍 " +
        lead.address +

        "\n\n" +

        "📞 " +
        lead.phone;


      if (lead.website) {

        message +=

          "\n\n🌐 " +
          lead.website;

      }


      if (
        lead.lat &&
        lead.lon
      ) {

        message +=

          "\n\n📌 Coordinates: " +

          lead.lat +

          ", " +

          lead.lon;

      }


      message +=

        "\n\n🗺️ Source: OpenStreetMap";


      alert(message);

    }


    /* =====================================================
       SAVE LEAD
       ===================================================== */

    function saveLead(lead) {


      const savedLeads =

        JSON.parse(
          localStorage.getItem(
            "savedLeads"
          )
        ) || [];


      const alreadySaved =

        savedLeads.some(
          saved =>

            saved.osmUrl ===
            lead.osmUrl

            ||

            (
              saved.name ===
              lead.name &&

              saved.address ===
              lead.address
            )
        );


      if (alreadySaved) {

        alert(
          "⭐ This lead is already saved!"
        );

        return;

      }


      savedLeads.push({

        name:
          lead.name,

        area:
          lead.address,

        phone:
          lead.phone,

        website:
          lead.website || "",

        lat:
          lead.lat || "",

        lon:
          lead.lon || "",

        osmUrl:
          lead.osmUrl || "",

        status:
          "New",

        note:
          "",

        updated:
          new Date().toLocaleString()

      });


      localStorage.setItem(

        "savedLeads",

        JSON.stringify(
          savedLeads
        )

      );


      updateDashboard();

      displaySavedLeads();


      alert(

        "⭐ Lead Saved!\n\n" +

        lead.name

      );

    }


    /* =====================================================
       CHANGE STATUS
       ===================================================== */

    function changeLeadStatus(
      id,
      status
    ) {


      const savedLeads =

        JSON.parse(
          localStorage.getItem(
            "savedLeads"
          )
        ) || [];


      const lead =

        savedLeads.find(
          item =>
            item.osmUrl === id
        );


      if (lead) {

        lead.status =
          status;

        lead.updated =
          new Date().toLocaleString();


        localStorage.setItem(

          "savedLeads",

          JSON.stringify(
            savedLeads
          )

        );

      }


      updateDashboard();

      displaySavedLeads();

    }


    /* =====================================================
       SAVE NOTE
       ===================================================== */

    function saveNote(id) {


      const noteBox =
        document.getElementById(
          "note-" +
          encodeURIComponent(id)
        );


      if (!noteBox) {
        return;
      }


      const note =
        noteBox.value;


      if (
        note.trim() === ""
      ) {

        alert(
          "Please write a note first!"
        );

        return;

      }


      const savedLeads =

        JSON.parse(
          localStorage.getItem(
            "savedLeads"
          )
        ) || [];


      const lead =

        savedLeads.find(
          item =>
            item.osmUrl === id
        );


      if (lead) {

        lead.note =
          note;

        lead.updated =
          new Date().toLocaleString();


        localStorage.setItem(

          "savedLeads",

          JSON.stringify(
            savedLeads
          )

        );

      }


      alert(
        "📝 Note Saved!"
      );


      displaySavedLeads();

    }


    /* =====================================================
       DELETE LEAD
       ===================================================== */

    function deleteLead(id) {


      const savedLeads =

        JSON.parse(
          localStorage.getItem(
            "savedLeads"
          )
        ) || [];


      const lead =

        savedLeads.find(
          item =>
            item.osmUrl === id
        );


      const confirmed =
        confirm(

          "Remove this saved lead?\n\n" +

          (
            lead
              ? lead.name
              : "This lead"
          )

        );


      if (!confirmed) {
        return;
      }


      const remaining =

        savedLeads.filter(
          item =>
            item.osmUrl !== id
        );


      localStorage.setItem(

        "savedLeads",

        JSON.stringify(
          remaining
        )

      );


      updateDashboard();

      displaySavedLeads();

    }


    /* =====================================================
       DISPLAY SAVED LEADS
       ===================================================== */

    function displaySavedLeads() {


      const savedLeads =

        JSON.parse(
          localStorage.getItem(
            "savedLeads"
          )
        ) || [];


      const savedList =
        document.getElementById(
          "savedList"
        );


      const searchBox =
        document.getElementById(
          "savedSearch"
        );


      const statusBox =
        document.getElementById(
          "savedStatus"
        );


      const searchText =

        searchBox

          ? searchBox.value
              .toLowerCase()

          : "";


      const selectedStatus =

        statusBox

          ? statusBox.value

          : "All";


      const filteredLeads =

        savedLeads.filter(
          lead => {


            const text =

              (
                lead.name +
                " " +
                lead.area +
                " " +
                lead.phone
              ).toLowerCase();


            const matchesSearch =

              text.includes(
                searchText
              );


            const matchesStatus =

              selectedStatus ===
              "All"

              ||

              (
                lead.status ||
                "New"
              ) ===
              selectedStatus;


            return (

              matchesSearch &&

              matchesStatus

            );

          }
        );


      savedList.innerHTML =
        "";


      if (
        filteredLeads.length ===
        0
      ) {

        savedList.innerHTML = `

          <div class="empty-message">

            No matching saved leads ⭐

          </div>

        `;

        return;

      }


      filteredLeads.forEach(
        lead => {


          const status =
            lead.status ||
            "New";


          const note =
            lead.note ||
            "";


          const id =
            lead.osmUrl;


          const encodedId =
            encodeURIComponent(id);


          let mapHTML =
            "";


          let directionHTML =
            "";


          if (
            lead.lat &&
            lead.lon
          ) {


            const mapUrl =

              `https://www.openstreetmap.org/?mlat=${lead.lat}&mlon=${lead.lon}#map=19/${lead.lat}/${lead.lon}`;


            const directionUrl =

              `https://www.google.com/maps/dir/?api=1&destination=${lead.lat},${lead.lon}`;


            mapHTML = `

              <a
                class="map-btn"
                href="${mapUrl}"
                target="_blank"
                rel="noopener noreferrer"
              >

                🗺️ View Location

              </a>

            `;


            directionHTML = `

              <a
                class="direction-btn"
                href="${directionUrl}"
                target="_blank"
                rel="noopener noreferrer"
              >

                🧭 Directions

              </a>

            `;

          }


          savedList.innerHTML += `

            <div class="lead">

              <h3>

                ${escapeHTML(
                  lead.name
                )}

              </h3>


              <p>

                📍
                ${escapeHTML(
                  lead.area
                )}

              </p>


              <p>

                📞
                ${escapeHTML(
                  lead.phone
                )}

              </p>


              ${
                lead.website

                ?

                `

                <p>

                  🌐

                  <a
                    href="${lead.website}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >

                    Website

                  </a>

                </p>

                `

                :

                ""

              }


              <select
                onchange="changeLeadStatus(
                  '${encodedId}',
                  this.value
                )"
              >

                <option
                  value="New"
                  ${status === "New"
                    ? "selected"
                    : ""}
                >

                  🆕 New

                </option>


                <option
                  value="Contacted"
                  ${status === "Contacted"
                    ? "selected"
                    : ""}
                >

                  📞 Contacted

                </option>


                <option
                  value="Follow-up"
                  ${status === "Follow-up"
                    ? "selected"
                    : ""}
                >

                  🔔 Follow-up

                </option>


                <option
                  value="Converted"
                  ${status === "Converted"
                    ? "selected"
                    : ""}
                >

                  💰 Converted

                </option>

              </select>


              <div class="saved-note">

                📝 Note:

                ${
                  escapeHTML(
                    note
                  ) ||

                  "No note added yet"
                }

              </div>


              <textarea
                class="note-box"
                id="note-${encodedId}"
                placeholder="Write a note..."
              >${escapeHTML(note)}</textarea>


              <div class="lead-actions">


                <button
                  onclick="saveNote(
                    '${encodedId}'
                  )"
                >

                  💾 Save Note

                </button>


                ${mapHTML}


                ${directionHTML}


                <button
                  class="danger-btn"
                  onclick="deleteLead(
                    '${encodedId}'
                  )"
                >

                  🗑️ Remove Lead

                </button>


              </div>


              <p class="updated">

                🕐 Last updated:

                ${escapeHTML(
                  lead.updated ||
                  "Not available"
                )}

              </p>

            </div>

          `;

        }
      );

    }


    /* =====================================================
       DASHBOARD
       ===================================================== */

    function updateDashboard() {


      const savedLeads =

        JSON.parse(
          localStorage.getItem(
            "savedLeads"
          )
        ) || [];


      let newCount = 0;

      let contactedCount = 0;

      let followupCount = 0;

      let convertedCount = 0;


      savedLeads.forEach(
        lead => {


          const status =
            lead.status ||
            "New";


          if (
            status === "New"
          ) {

            newCount++;

          }

          else if (
            status ===
            "Contacted"
          ) {

            contactedCount++;

          }

          else if (
            status ===
            "Follow-up"
          ) {

            followupCount++;

          }

          else if (
            status ===
            "Converted"
          ) {

            convertedCount++;

          }

        }
      );


      document.getElementById(
        "totalLeads"
      ).innerText =
        savedLeads.length;


      document.getElementById(
        "newLeads"
      ).innerText =
        newCount;


      document.getElementById(
        "contactedLeads"
      ).innerText =
        contactedCount;


      document.getElementById(
        "followupLeads"
      ).innerText =
        followupCount;


      document.getElementById(
        "convertedLeads"
      ).innerText =
        convertedCount;

    }


    /* =====================================================
       DASHBOARD FILTER
       ===================================================== */

    function filterDashboard(
      status
    ) {


      const statusBox =
        document.getElementById(
          "savedStatus"
        );


      statusBox.value =
        status;


      displaySavedLeads();


      document.getElementById(
        "savedSection"
      ).scrollIntoView({

        behavior: "smooth"

      });

    }


    /* =====================================================
       INITIAL LOAD
       ===================================================== */

    updateDashboard();

    displaySavedLeads();


  </script>


</body>
